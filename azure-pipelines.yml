trigger:
- main

pool:
  name: flm-pool

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- task: Maven@4
  inputs:
    mavenPomFile: 'pom.xml'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    mavenVersionOption: 'Default'
    mavenAuthenticateFeed: false
    effectivePomSkip: false
    sonarQubeRunAnalysis: false

- task: TomcatDeployment@1
  inputs:
    TomcatUrl: 'http://20.84.104.218:8080/'
    Username: 'tomcat'
    Password: 'admin@123'
    Warfile: 'target/myweb-8.7.4.war'
    Context: '/'
    ServerVersion: '7OrAbove'

- task: CmdLine@2
  displayName: 'Build Docker image'
  inputs:
    script: |
      IMAGE_TAG=$(TZ=Asia/Kolkata date +%Y-%m-%d-%H_%M_%S)
      echo "Building image with IST tag: $IMAGE_TAG"
      docker build -t myapp:$IMAGE_TAG .
      docker tag myapp:$IMAGE_TAG srikanth0209/azure-repo:$IMAGE_TAG
      echo "##vso[task.setvariable variable=IMAGE_TAG]$IMAGE_TAG"
- task: Docker@2
  displayName: 'Push Docker image to Docker Hub'
  inputs:
    containerRegistry: 'docker-hub'
    repository: 'srikanth0209/azure-repo'
    command: 'push'
    tags: |
      $(IMAGE_TAG)



