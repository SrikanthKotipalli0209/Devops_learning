trigger:
- main

pool:
  name: flm-pool

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- task: Maven@4
  inputs:
    mavenPomFile: 'pom.xml'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    mavenVersionOption: 'Default'
    mavenAuthenticateFeed: false
    effectivePomSkip: false
    sonarQubeRunAnalysis: false

- task: TomcatDeployment@1
  inputs:
    TomcatUrl: 'http://20.84.104.218:8080/'
    Username: 'tomcat'
    Password: 'admin@123'
    Warfile: 'target/myweb-8.7.4.war'
    Context: '/'
    ServerVersion: '7OrAbove'

- task: CmdLine@2
  displayName: 'Build Docker image'
  inputs:
    script: |
      IMAGE_TAG=$(date +%Y%m%d-%H%M%S)
      echo "Building image with tag: $IMAGE_TAG"
      docker build -t myapp:$IMAGE_TAG .
      echo "##vso[task.setvariable variable=IMAGE_TAG]$IMAGE_TAG"

- task: CmdLine@2
  inputs:
    script: 'docker run -d --name java3-image -p 1122:8080 myapp:$IMAGE_TAG'