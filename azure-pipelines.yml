trigger:
- main

pool:
  name: flm-pool

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- task: Maven@4
  inputs:
    mavenPomFile: 'pom.xml'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    javaHomeOption: 'JDKVersion'
    mavenVersionOption: 'Default'
    mavenAuthenticateFeed: false
    effectivePomSkip: false
    sonarQubeRunAnalysis: false

- task: TomcatDeployment@1
  inputs:
    TomcatUrl: 'http://20.84.104.218:8080/'
    Username: 'tomcat'
    Password: 'admin@123'
    Warfile: 'target/myweb-8.7.4.war'
    Context: '/'
    ServerVersion: '7OrAbove'

- task: CmdLine@2
  displayName: 'Build Docker image'
  inputs:
    script: |
      docker pull tomcat:9.0.122-jre8-temurin
      docker build -t myapp:latest .

- task: CmdLine@2
  inputs:
    script: 'docker run -d --name java-image -p 1234:8080 myapp:latest'